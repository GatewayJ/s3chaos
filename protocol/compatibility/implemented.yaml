apiVersion: rustfs.com/s3chaos/v1alpha1
kind: ProtocolCompatibilityStatus
status: implemented
source: ceph/s3-tests
sourceRevision: 5522d1c351f75bc00ae0f64f742f3f095f5939d9
entries:
  - id: test_bucket_head
    nativeCase: compat-bucket-head
    mapping: exact-one-to-one
    reason: Creates a bucket and requires HeadBucket to return success.
  - id: test_bucket_create_delete
    nativeCase: compat-bucket-list-create-delete
    mapping: table-driven-many-to-one
    variant: lifecycle
    reason: Creates and discovers the bucket, then requires registered-resource cleanup to delete it without leftovers.
  - id: test_bucket_list_empty
    nativeCase: compat-bucket-list-create-delete
    mapping: table-driven-many-to-one
    variant: empty-list
    reason: Creates a bucket and asserts ListObjectsV2 returns no keys and KeyCount zero.
  - id: test_basic_key_count
    nativeCase: compat-list-objects-basic
    mapping: exact-one-to-one
    reason: Creates five keys and asserts the ListObjectsV2 KeyCount and returned key set.
  - id: test_multi_object_delete
    nativeCase: compat-multi-object-delete
    mapping: exact-one-to-one
    reason: Deletes three keys in one request, verifies the response and retries idempotently.
  - id: test_multipart_upload_small
    nativeCase: compat-multipart-upload-small
    mapping: exact-one-to-one
    reason: Completes a one-byte multipart upload, retries completion and verifies the body.
  - id: test_object_copy_same_bucket
    nativeCase: compat-object-copy-same-bucket
    mapping: exact-one-to-one
    reason: Copies an object inside one bucket and verifies the copied body.
  - id: test_object_write_read_update_read_delete
    nativeCase: compat-object-put-get-delete
    mapping: exact-one-to-one
    reason: Covers write/read, overwrite/read, delete, and post-delete read semantics.
  - id: test_put_get_delete_public_block
    nativeCase: public-access-block-round-trip
    mapping: exact-one-to-one
    reason: Round-trips all public access block fields and verifies deletion visibility.
  - id: test_versioning_obj_create_read_remove_head
    nativeCase: compat-versioning-head-removal
    mapping: exact-one-to-one
    reason: Creates five versions, removes the head, verifies its predecessor and a delete marker.
