apiVersion: rustfs.com/s3chaos/v1alpha1
kind: ProtocolSuite
metadata:
  name: rustfs-full-regression
selector:
  # The full profile rejects any case tagged smoke or slow
  # (validate_protocol_execution_profile_as in src/protocol/suite.rs), so the
  # smoke-gate cases and the slow STS expiration case must be excluded here.
  # They are not skipped: the smoke profile runs the first three before this
  # suite, and slow-regression.yaml runs the last one after it.
  excludeCases:
    - bucket-policy-authenticated-user-rw
    - iam-canned-policy-console-admin-delete
    - sts-expired-token-denied
execution:
  profile: full
  parallelism: 1
  defaultIsolation: case
  cleanup: always
  timeouts:
    caseSeconds: 180
    suiteSeconds: 3600
target:
  endpoint: ${RUSTFS_PROTOCOL_TEST_ENDPOINT}
  region: us-east-1
  credentials:
    adminProfile: root
    provider: env
  ownership:
    mode: dedicated-tenant
    resourcePrefixes:
      bucket: s3c
      identity: s3chaos
  safety:
    dedicatedTarget: required
contracts:
  # delete-force-header-contract: expectation for a non-owner single-object
  # DeleteObject that carries X-Rustfs-Force-Delete: true. ignore-header follows
  # the rustfs/rustfs#7649 reporter (plain DeleteObject semantics); reject asserts
  # the AccessDenied RustFS main currently returns. Unknown values fail validation.
  forceDeleteHeaderSingleObject: ignore-header
